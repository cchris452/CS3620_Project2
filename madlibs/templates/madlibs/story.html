{% extends "madlibs/base.html" %}
{% block title %}Your Story | Mad Libs{% endblock %}
{% block body %}
    <section class="page-wrap">
        <div class="page-heading">
            <p class="eyebrow">Fresh off the page</p>
            <h1>{{ madlib.name }}'s story</h1>
        </div>
        <article class="story-paper">
            <p>{{ story_text }}</p>
        </article>
        <div class="actions">
            <a class="button" href="{% url 'madlibs:create' %}">Make another</a>
            <a class="button button-secondary" href="{% url 'madlibs:stories' %}">Browse all stories</a>
        </div>
    </section>
{% endblock %}
